name: Deploy 0rac1es to GitHub Pages

# Serves the build-free creation at apps/app/dist/ as the Pages site.
# URL: https://random-knights.github.io/r1-01/  (load this on the r1)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
