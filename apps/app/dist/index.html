<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, height=282, user-scalable=no, initial-scale=1.0">
  <title>0rac1es</title>
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Top: page number (no oracle-name label, no instruction text) -->
    <div id="page-number">1/15</div>

    <!-- Nav chevrons flank the orb (in the side gutters), hinting you can
         change oracles. Tappable: left = previous, right = next. -->
    <div id="nav-prev" class="nav-arrow" role="button" aria-label="Previous oracle">&lsaquo;</div>
    <div id="nav-next" class="nav-arrow" role="button" aria-label="Next oracle">&rsaquo;</div>

    <!-- Middle: the square orb (PNG art + GIF overlay + quote) -->
    <div id="orb">
      <div id="png-background"></div>
      <div id="gif-overlay"></div>
      <div id="quote-text"></div>
    </div>

    <!-- Caption: hint sitting in the band between the orb and the dots. -->
    <div id="caption">tap, click, or shake to reveal</div>

    <!-- Bottom: page indicator dots -->
    <div id="page-dots"></div>
  </div>

  <script src="./main.js" defer></script>
</body>
</html>
